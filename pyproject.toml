[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ml-regression-watch"
version = "0.1.0"
description = "Benchmarking, numerical validation, and CI regression detection for ML models across execution configurations."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Valerio Maggio" }]
keywords = ["benchmarking", "regression-testing", "pytorch", "numerical-validation", "reproducibility"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
    "torch==2.12.0",
    "torchvision==0.27.0",
    "transformers==5.3.0",
    "numpy>=1.26,<3",
    "scipy>=1.11,<2",
    "typer>=0.12,<1",
    "matplotlib>=3.8,<4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9",
    "ruff>=0.6,<1",
]

[project.urls]
Homepage = "https://github.com/leriomaggio/ml-regression-watch"
Repository = "https://github.com/leriomaggio/ml-regression-watch"

[project.scripts]
mlrw = "mlrw.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
